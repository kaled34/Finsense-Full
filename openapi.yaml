openapi: 3.0.3

info:
  title: FinSense API
  description: |
    API REST del sistema FinSense para gestion financiera personal.
    La mayoria de endpoints requieren token JWT en header Authorization Bearer.
  version: "1.0.0"

servers:
  - url: https://finsense-backend.onrender.com/api
    description: Servidor de produccion
  - url: http://localhost:3001/api
    description: Servidor local

tags:
  - name: Auth
    description: Autenticacion y perfil
  - name: Transactions
    description: Gestion de transacciones
  - name: Goals
    description: Metas de ahorro
  - name: Budgets
    description: Presupuestos por categoria
  - name: Analytics
    description: Analisis y proyecciones
  - name: Subscriptions
    description: Suscripciones recurrentes
  - name: Groups
    description: Gastos grupales
  - name: Notifications
    description: Notificaciones del sistema
  - name: Gamification
    description: XP, logros y niveles
  - name: Investments
    description: Portafolio de inversiones
  - name: Reports
    description: Exportacion de reportes
  - name: Calendar Events
    description: Eventos en calendario

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          example: maria@upchiapas.edu.mx
        password:
          type: string
          minLength: 6
          example: mipassword123
        name:
          type: string
          example: Maria Lopez
        city:
          type: string
          example: Tuxtla Gutierrez

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: maria@upchiapas.edu.mx
        password:
          type: string
          example: mipassword123

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        city:
          type: string
        avatar:
          type: string
          nullable: true
        level:
          type: integer
        xp:
          type: integer
        xpToNextLevel:
          type: integer
        streakDays:
          type: integer
        maxStreak:
          type: integer
        coins:
          type: integer
        monthsActive:
          type: integer
        goalsCompleted:
          type: integer
        registeredToday:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateTransactionRequest:
      type: object
      required: [amount, type]
      properties:
        amount:
          type: number
          minimum: 0.01
          example: 150.00
        type:
          type: string
          enum: [income, expense]
          example: expense
        categoryId:
          type: string
          example: food
        categoryName:
          type: string
          example: Alimentacion
        description:
          type: string
          example: tacos en el centro
        date:
          type: string
          format: date
          example: "2026-05-23"
        groupId:
          type: string
          format: uuid
          nullable: true

    UpdateTransactionRequest:
      type: object
      properties:
        amount:
          type: number
          minimum: 0.01
        type:
          type: string
          enum: [income, expense]
        categoryId:
          type: string
        description:
          type: string
        date:
          type: string
          format: date

    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        amount:
          type: number
        type:
          type: string
          enum: [income, expense]
        description:
          type: string
        date:
          type: string
          format: date-time
        categoryId:
          type: string
          format: uuid
          nullable: true
        category:
          $ref: '#/components/schemas/Category'
        groupId:
          type: string
          nullable: true

    TransactionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        icon:
          type: string
        color:
          type: string

    CreateGoalRequest:
      type: object
      required: [name, targetAmount]
      properties:
        name:
          type: string
          example: Laptop nueva
        targetAmount:
          type: number
          minimum: 1
          example: 15000
        deadline:
          type: string
          format: date
          example: "2026-12-31"
        icon:
          type: string
        color:
          type: string

    DepositGoalRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          minimum: 0.01
          example: 500

    Goal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        targetAmount:
          type: number
        currentAmount:
          type: number
        status:
          type: string
          enum: [active, completed, cancelled]
        deadline:
          type: string
          format: date
          nullable: true
        icon:
          type: string
          nullable: true
        color:
          type: string
          nullable: true

    DepositResponse:
      type: object
      properties:
        goal:
          $ref: '#/components/schemas/Goal'
        completed:
          type: boolean
        xpGained:
          type: integer

    CreateBudgetRequest:
      type: object
      required: [categoryId, limitAmount]
      properties:
        categoryId:
          type: string
          format: uuid
        limitAmount:
          type: number
          minimum: 1
          example: 3000
        month:
          type: string
          example: "2026-08"

    Budget:
      type: object
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
        categoryName:
          type: string
        categoryIcon:
          type: string
        categoryColor:
          type: string
        limit:
          type: number
        spent:
          type: number
        pct:
          type: number
        status:
          type: string
          enum: [healthy, warning, exceeded]
        month:
          type: string

    CreateSubscriptionRequest:
      type: object
      required: [name, cost, nextBillingDate]
      properties:
        name:
          type: string
          example: Netflix
        cost:
          type: number
          example: 219
        currency:
          type: string
          example: MXN
        billingCycle:
          type: string
          enum: [monthly, yearly]
        nextBillingDate:
          type: string
          format: date
          example: "2026-09-01"
        category:
          type: string
        iconUrl:
          type: string
          nullable: true

    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Departamentos
        memberIds:
          type: array
          items:
            type: string
            format: uuid

    AddExpenseRequest:
      type: object
      required: [amount, description, splitBetween]
      properties:
        amount:
          type: number
          example: 800
        description:
          type: string
          example: Compras del super
        splitBetween:
          type: array
          items:
            type: string
            format: uuid
        paidBy:
          type: string
          format: uuid
          nullable: true

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        title:
          type: string
        body:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        error:
          type: string

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        "201":
          description: Usuario registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        "400":
          description: Datos invalidos
        "409":
          description: Usuario ya existe

  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        "401":
          description: Credenciales incorrectas

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renovar token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Token renovado

  /auth/me:
    get:
      tags: [Auth]
      summary: Perfil actual
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Datos del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'

  /auth/profile:
    patch:
      tags: [Auth]
      summary: Actualizar perfil
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                city:
                  type: string
                avatar:
                  type: string
      responses:
        "200":
          description: Perfil actualizado

  /auth/users:
    get:
      tags: [Auth]
      summary: Listar usuarios
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de usuarios

  /auth/users/search:
    get:
      tags: [Auth]
      summary: Buscar usuarios
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Usuarios encontrados

  /transactions:
    get:
      tags: [Transactions]
      summary: Listar transacciones
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Lista de transacciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListResponse'

    post:
      tags: [Transactions]
      summary: Crear transaccion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        "201":
          description: Transaccion creada

  /transactions/{id}:
    put:
      tags: [Transactions]
      summary: Actualizar transaccion
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionRequest'
      responses:
        "200":
          description: Transaccion actualizada

    delete:
      tags: [Transactions]
      summary: Eliminar transaccion
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transaccion eliminada

  /goals:
    get:
      tags: [Goals]
      summary: Listar metas
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de metas

    post:
      tags: [Goals]
      summary: Crear meta
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalRequest'
      responses:
        "201":
          description: Meta creada

  /goals/{id}:
    put:
      tags: [Goals]
      summary: Actualizar meta
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalRequest'
      responses:
        "200":
          description: Meta actualizada

    delete:
      tags: [Goals]
      summary: Eliminar meta
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Meta eliminada

  /goals/{id}/deposit:
    post:
      tags: [Goals]
      summary: Abonar a meta
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositGoalRequest'
      responses:
        "201":
          description: Abono registrado

  /budgets:
    get:
      tags: [Budgets]
      summary: Listar presupuestos
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Presupuestos del mes

    post:
      tags: [Budgets]
      summary: Crear o actualizar presupuesto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBudgetRequest'
      responses:
        "201":
          description: Presupuesto guardado

  /budgets/categories:
    get:
      tags: [Budgets]
      summary: Categorias de presupuestos
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Categorias disponibles

  /budgets/{id}:
    put:
      tags: [Budgets]
      summary: Actualizar presupuesto
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                limitAmount:
                  type: number
      responses:
        "200":
          description: Presupuesto actualizado

    delete:
      tags: [Budgets]
      summary: Eliminar presupuesto
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Presupuesto eliminado

  /analytics/summary:
    get:
      tags: [Analytics]
      summary: Resumen financiero
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resumen general

  /analytics/benchmarks:
    get:
      tags: [Analytics]
      summary: Comparacion regional
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Datos comparativos

  /analytics/monthly-comparison:
    get:
      tags: [Analytics]
      summary: Comparacion mensual
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Historico mensual

  /analytics/predictions:
    get:
      tags: [Analytics]
      summary: Predicciones de gasto
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Proyecciones futuras

  /analytics/anomalies:
    get:
      tags: [Analytics]
      summary: Gastos inusuales
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Anomalias detectadas

  /analytics/heatmap:
    get:
      tags: [Analytics]
      summary: Mapa de actividad
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Datos de frecuencia

  /analytics/fugas:
    get:
      tags: [Analytics]
      summary: Deteccion de microgastos
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Microgastos identificados

  /subscriptions:
    get:
      tags: [Subscriptions]
      summary: Listar suscripciones
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de suscripciones

    post:
      tags: [Subscriptions]
      summary: Crear suscripcion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        "201":
          description: Suscripcion registrada

  /subscriptions/{id}:
    put:
      tags: [Subscriptions]
      summary: Actualizar suscripcion
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                cost:
                  type: number
                status:
                  type: string
      responses:
        "200":
          description: Suscripcion actualizada

    delete:
      tags: [Subscriptions]
      summary: Eliminar suscripcion
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Suscripcion eliminada

  /groups:
    get:
      tags: [Groups]
      summary: Listar grupos
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Mis grupos

    post:
      tags: [Groups]
      summary: Crear grupo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        "201":
          description: Grupo creado

  /groups/{id}:
    get:
      tags: [Groups]
      summary: Detalle de grupo
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Informacion del grupo

  /groups/{id}/members:
    post:
      tags: [Groups]
      summary: Agregar miembro
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
      responses:
        "201":
          description: Miembro agregado

  /groups/{id}/expenses:
    get:
      tags: [Groups]
      summary: Gastos del grupo
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lista de gastos

    post:
      tags: [Groups]
      summary: Registrar gasto grupal
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddExpenseRequest'
      responses:
        "201":
          description: Gasto registrado

  /groups/{id}/balances:
    get:
      tags: [Groups]
      summary: Balances de cuentas
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Balances calculados

  /groups/{id}/debts/simplified:
    get:
      tags: [Groups]
      summary: Deudas simplificadas
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transferencias sugeridas

  /groups/{id}/messages:
    get:
      tags: [Groups]
      summary: Mensajes del grupo
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Historial de mensajes

  /notifications:
    get:
      tags: [Notifications]
      summary: Listar notificaciones
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notificaciones del usuario

  /notifications/generate:
    post:
      tags: [Notifications]
      summary: Generar alerta
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Alerta generada

  /notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Marcar todas leidas
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Estado actualizado

  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Marcar leida
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Estado actualizado

  /notifications/{id}:
    delete:
      tags: [Notifications]
      summary: Eliminar notificacion
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Notificacion eliminada

  /gamification/profile:
    get:
      tags: [Gamification]
      summary: Perfil de juego
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Puntos y nivel

  /gamification/users/{id}/profile:
    get:
      tags: [Gamification]
      summary: Perfil publico
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Perfil publico

  /gamification/quests:
    get:
      tags: [Gamification]
      summary: Misiones
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de misiones

  /gamification/achievements:
    get:
      tags: [Gamification]
      summary: Logros
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de logros

  /gamification/leaderboard:
    get:
      tags: [Gamification]
      summary: Tabla de lideres
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ranking general

  /gamification/purchase:
    post:
      tags: [Gamification]
      summary: Comprar item
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                itemId:
                  type: string
                price:
                  type: number
      responses:
        "201":
          description: Compra realizada

  /gamification/daily-reward:
    post:
      tags: [Gamification]
      summary: Recompensa diaria
      security:
        - bearerAuth: []

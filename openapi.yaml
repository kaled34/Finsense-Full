              properties:
                itemId:
                  type: string
                price:
                  type: integer
                type:
                  type: string
                metadata:
                  type: object
      responses:
        "201":
          description: Compra realizada exitosamente

  /gamification/daily-reward:
    post:
      tags: [Gamification]
      summary: Reclamar recompensa diaria
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Recompensa reclamada o ya reclamada hoy
          content:
            application/json:
              example:
                success: true
                xpAwarded: 25
                coinsAwarded: 10

  /gamification/equip-skin:
    post:
      tags: [Gamification]
      summary: Equipar skin de mascota
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skinId]
              properties:
                skinId:
                  type: string
      responses:
        "201":
          description: Skin equipada

  /gamification/open-chest:
    post:
      tags: [Gamification]
      summary: Abrir cofre de recompensas aleatorias
      security:
        - bearerAuth: []

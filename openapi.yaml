  /gamification/trivia-questions:
    get:
      tags: [Gamification]
      summary: Obtener preguntas de trivia financiera
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de preguntas de trivia generadas

  /gamification/budget-game-data:
    get:
      tags: [Gamification]
      summary: Obtener datos para el juego de presupuesto
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Datos del juego de presupuesto

  # ═══════════════════════════════════════════
  # INVESTMENTS
  # ═══════════════════════════════════════════
  /investments:
    get:
      tags: [Investments]
      summary: Listar inversiones del usuario
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Portafolio de inversiones con valor actual

    post:
      tags: [Investments]
      summary: Registrar nueva inversión
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, initialAmount, currentValue, purchaseDate]
              properties:
                name:
                  type: string
                  example: Apple Inc.
                type:
                  type: string
                  example: stocks
                initialAmount:
                  type: number
                  example: 5000
                currentValue:
                  type: number
                  example: 5800
                purchaseDate:
                  type: string
                  format: date
                ticker:
                  type: string
                  example: AAPL
                shares:
                  type: number
                notes:
                  type: string
      responses:
        "201":
          description: Inversión registrada

  /investments/search:
    get:
      tags: [Investments]
      summary: Buscar ticker de acción/activo
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          example: AAPL
      responses:
        "200":
          description: Resultados de búsqueda de tickers

  /investments/sync:
    post:
      tags: [Investments]
      summary: Sincronizar precios actuales de inversiones
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Precios actualizados desde API de mercado

  /investments/{id}:
    put:
      tags: [Investments]
      summary: Actualizar inversión existente
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentValue:
                  type: number
                name:
                  type: string
                notes:
                  type: string
      responses:
        "200":
          description: Inversión actualizada

    delete:
      tags: [Investments]
      summary: Eliminar inversión
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Inversión eliminada

  # ═══════════════════════════════════════════
  # REPORTS
  # ═══════════════════════════════════════════
  /reports/csv:
    get:
      tags: [Reports]
      summary: Exportar transacciones como CSV (descarga directa)
      description: Genera un archivo CSV con BOM UTF-8 para compatibilidad con Excel.
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
          example: month
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Archivo CSV
          content:
            text/csv:
              schema:
                type: string

  /reports/summary:
    get:
      tags: [Reports]
      summary: Obtener reporte resumido de transacciones
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Reporte con totales y distribución por categoría

  # ═══════════════════════════════════════════
  # CALENDAR EVENTS
  # ═══════════════════════════════════════════
  /calendar-events:
    get:
      tags: [Calendar Events]
      summary: Listar eventos financieros en el calendario
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de eventos del calendario

    post:
      tags: [Calendar Events]
      summary: Crear nuevo evento en el calendario
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                date:
                  type: string
                  format: date
                amount:
                  type: number
                  nullable: true
                type:
                  type: string
      responses:
        "201":
          description: Evento creado

  /calendar-events/{id}:
    delete:
      tags: [Calendar Events]
      summary: Eliminar evento del calendario
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Evento eliminado
